name: Run Wallpaper Search Test Suite

on:
  workflow_dispatch: # Manual triggering from GitHub UI only
    inputs:
      website:
        description: 'Base URL of the website to test'
        required: true
        type: string
      search_keyword:
        description: 'Search keyword to use in tests'
        required: true
        type: string

jobs:
  test:
    name: Playwright Tests for Wallpaper Search
    runs-on: ubuntu-latest # GitHub-hosted runner (free for public repos)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use Node.js 20 (LTS)
          cache: 'npm' # Cache npm dependencies for faster builds

      - name: Install dependencies
        run: npm ci # Use npm ci for faster, reliable, reproducible builds

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        # Use --with-deps to install system dependencies

      - name: Run Playwright tests
        env:
          # Use workflow inputs
          BASE_URL: ${{ github.event.inputs.website }}
          SEARCH_KEYWORD: ${{ github.event.inputs.search_keyword }}
        run: npm test

      - name: Upload test results
        if: always() # Upload even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure() # Only upload on failure
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

